<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A single rotor steps one notch per keystroke</title>
  <desc id="d">A fixed column of typed letters A, B, C through Z is wired to a rotor column of emitted letters. At position zero the wiring sends A to K, B to S, C to T and Z to E. After each keystroke the rotor column shifts down one notch, so three presses of the same letter C emit T, then S, then K.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="428.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="40" font-size="15" font-weight="700" fill="#0f172a">One rotor, three keystrokes</text>

  <!-- panel 0 -->
  <text x="88" y="60" font-size="11" fill="#64748b" text-anchor="middle">typed letter</text>
  <text x="264" y="60" font-size="11" fill="#64748b" text-anchor="middle">emitted letter</text>
  <rect x="56" y="68" width="64" height="224" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="232" y="68" width="64" height="224" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="120" y1="96" x2="232" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="140" x2="232" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="184" x2="232" y2="184" stroke="#d97706" stroke-width="2.5"/>
  <line x1="120" y1="228" x2="232" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="272" x2="232" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="88" y="101" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">A</text>
  <text x="88" y="145" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">B</text>
  <text x="88" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">C</text>
  <text x="88" y="233" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="88" y="277" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Z</text>
  <text x="264" y="101" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">K</text>
  <text x="264" y="145" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">S</text>
  <text x="264" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">T</text>
  <text x="264" y="233" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="264" y="277" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">E</text>
  <text x="176" y="320" font-size="12" fill="#64748b" text-anchor="middle">rotor position 0</text>
  <text x="176" y="342" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">press C, emit T</text>

  <line x1="300" y1="184" x2="356" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- panel 1 -->
  <rect x="360" y="68" width="64" height="224" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="536" y="68" width="64" height="224" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="424" y1="96" x2="536" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="424" y1="140" x2="536" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="424" y1="184" x2="536" y2="184" stroke="#d97706" stroke-width="2.5"/>
  <line x1="424" y1="228" x2="536" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="424" y1="272" x2="536" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="392" y="101" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">A</text>
  <text x="392" y="145" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">B</text>
  <text x="392" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">C</text>
  <text x="392" y="233" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="392" y="277" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Z</text>
  <text x="568" y="101" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">E</text>
  <text x="568" y="145" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">K</text>
  <text x="568" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">S</text>
  <text x="568" y="233" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="568" y="277" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">N</text>
  <text x="480" y="320" font-size="12" fill="#64748b" text-anchor="middle">after one notch</text>
  <text x="480" y="342" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">press C again, emit S</text>

  <line x1="604" y1="184" x2="660" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- panel 2 -->
  <rect x="664" y="68" width="64" height="224" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="840" y="68" width="64" height="224" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <line x1="728" y1="96" x2="840" y2="96" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="728" y1="140" x2="840" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="728" y1="184" x2="840" y2="184" stroke="#d97706" stroke-width="2.5"/>
  <line x1="728" y1="228" x2="840" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="728" y1="272" x2="840" y2="272" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="696" y="101" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">A</text>
  <text x="696" y="145" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">B</text>
  <text x="696" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">C</text>
  <text x="696" y="233" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="696" y="277" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Z</text>
  <text x="872" y="101" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">N</text>
  <text x="872" y="145" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">E</text>
  <text x="872" y="189" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">K</text>
  <text x="872" y="233" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">⋮</text>
  <text x="872" y="277" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">R</text>
  <text x="784" y="320" font-size="12" fill="#64748b" text-anchor="middle">after two notches</text>
  <text x="784" y="342" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">press C once more, emit K</text>

  <line x1="48" y1="392" x2="88" y2="392" stroke="#d97706" stroke-width="2.5"/>
  <text x="96" y="396" font-size="12" fill="#475569">the wire used by the keystroke C; the rotor column shifts down one position after every press</text>
</svg>
