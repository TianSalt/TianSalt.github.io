<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A symmetric cipher, end to end</title>
  <desc id="d">The message m enters Alice's encryption box E together with the secret key k. The ciphertext c = E(k, m) crosses an insecure channel and enters Bob's decryption box D, which also holds k and returns m = D(k, c).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="398.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="54" font-size="22.5" font-weight="700" fill="#0f172a">A symmetric cipher, end to end</text>

  <text x="144" y="112" font-size="22.5" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text>
  <text x="710" y="112" font-size="22.5" font-weight="700" fill="#0f172a" text-anchor="middle">Bob</text>

  <text x="48" y="190" font-size="27.5" fill="#0f172a">m</text>
  <line x1="78" y1="182" x2="100" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="104" y="142" width="80" height="80" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="144" y="194" font-size="32.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">E</text>
  <text x="144" y="306" font-size="25" font-weight="700" fill="#1d4ed8" text-anchor="middle">k</text>
  <line x1="144" y1="288" x2="144" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="184" y1="182" x2="666" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="166" font-size="21.25" fill="#475569" text-anchor="middle">c = E(k, m)</text>
  <rect x="350" y="154" width="260" height="56" rx="28" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="480" y="188" font-size="20" fill="#475569" text-anchor="middle">insecure channel</text>

  <rect x="670" y="142" width="80" height="80" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="710" y="194" font-size="32.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">D</text>
  <text x="710" y="306" font-size="25" font-weight="700" fill="#1d4ed8" text-anchor="middle">k</text>
  <line x1="710" y1="288" x2="710" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="750" y1="182" x2="786" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="794" y="190" font-size="24" fill="#0f172a">m = D(k, c)</text>

  <text x="48" y="362" font-size="18.75" fill="#475569">E and D are public; the only secret is k, which both sides hold.</text>
</svg>
