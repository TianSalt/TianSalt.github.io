<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', sans-serif">
  <title id="t">The cryptographic threat model</title>
  <desc id="d">Alice and Bob share a secret key k and communicate over an insecure channel. Eve observes and may modify the ciphertext c.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="398.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="380" y="28" width="200" height="38" rx="19" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="480" y="53" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="700">shared secret  k</text>
  <line x1="400" y1="66" x2="140" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 6"/>
  <line x1="560" y1="66" x2="820" y2="120" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 6"/>
  <rect x="55" y="120" width="170" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="140" y="157" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">Alice</text>
  <text x="140" y="184" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">holds  k</text>
  <rect x="735" y="120" width="170" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="820" y="157" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">Bob</text>
  <text x="820" y="184" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">holds  k</text>
  <rect x="265" y="132" width="430" height="78" rx="39" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="480" y="158" font-size="15" fill="#475569" text-anchor="middle" font-weight="600">insecure channel</text>
  <line x1="292" y1="188" x2="668" y2="188" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <text x="480" y="180" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="600">c = E(k, m)</text>
  <rect x="405" y="268" width="150" height="76" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="480" y="299" font-size="21" fill="#dc2626" text-anchor="middle" font-weight="700">Eve</text>
  <text x="480" y="324" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="400">observes / modifies</text>
  <line x1="440" y1="268" x2="410" y2="210" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 6"/>
  <line x1="520" y1="268" x2="550" y2="210" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 6"/>
  <text x="55" y="382" font-size="15" fill="#1d4ed8" text-anchor="start" font-weight="600">Confidentiality: Eve cannot read  m</text>
  <text x="905" y="382" font-size="15" fill="#059669" text-anchor="end" font-weight="600">Integrity: Eve cannot alter  c  undetected</text>
</svg>
