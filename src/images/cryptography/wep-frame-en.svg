<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The structure of a WEP frame</title>
  <desc id="d">A frame m is extended with a checksum CRC(m). The stream cipher key is the concatenation of a 24-bit counter IV and the long-term key k, which is fed to a PRG; the resulting pad is XORed with m and CRC(m). The IV travels in the clear alongside the ciphertext.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="428.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="48" font-size="19" font-weight="700" fill="#0f172a">A WEP frame</text>

  <text x="240" y="86" font-size="15.5" fill="#475569">pad  PRG(IV &#x2016; k)</text>
  <rect x="240" y="96" width="380" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>

  <rect x="48" y="150" width="160" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="128" y="181" font-size="16.5" fill="#0f172a" text-anchor="middle">m &#x2016; CRC(m)</text>
  <line x1="208" y1="176" x2="236" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="158" width="380" height="36" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

  <line x1="620" y1="116" x2="674" y2="116" stroke="#475569" stroke-width="1.5"/>
  <line x1="674" y1="116" x2="674" y2="126" stroke="#475569" stroke-width="1.5"/>
  <line x1="620" y1="176" x2="674" y2="176" stroke="#475569" stroke-width="1.5"/>
  <line x1="674" y1="176" x2="674" y2="164" stroke="#475569" stroke-width="1.5"/>
  <circle cx="674" cy="145" r="19" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="674" y="152" font-size="23" fill="#334155" text-anchor="middle">&#x2295;</text>

  <line x1="693" y1="145" x2="721" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="725" y="119" width="190" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="820" y="140" font-size="16.5" font-weight="700" fill="#0f172a" text-anchor="middle">ciphertext &#x2016; IV</text>
  <text x="820" y="161" font-size="14" fill="#dc2626" text-anchor="middle">IV in the clear</text>

  <text x="48" y="256" font-size="15.5" fill="#475569">stream cipher key, new for every frame</text>
  <rect x="48" y="268" width="140" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="118" y="292" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">IV</text>
  <text x="118" y="311" font-size="12.5" fill="#1e40af" text-anchor="middle">24-bit counter</text>
  <text x="208" y="300" font-size="22" fill="#475569" text-anchor="middle">&#x2016;</text>
  <rect x="228" y="268" width="170" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="313" y="292" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">k</text>
  <text x="313" y="311" font-size="12.5" fill="#1e40af" text-anchor="middle">long-term, 104 bits</text>
  <line x1="402" y1="294" x2="450" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="458" y="268" width="120" height="52" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="518" y="300" font-size="19" font-weight="700" fill="#1e3a8a" text-anchor="middle">PRG</text>
  <line x1="518" y1="268" x2="518" y2="228" stroke="#475569" stroke-width="1.5"/>
  <line x1="518" y1="228" x2="212" y2="228" stroke="#475569" stroke-width="1.5"/>
  <line x1="212" y1="228" x2="212" y2="116" stroke="#475569" stroke-width="1.5"/>
  <line x1="212" y1="116" x2="236" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="48" y="404" font-size="15" fill="#dc2626">the IV has only 2&#xB2;&#x2074; values, and on some cards resets to 0 after a power cycle</text>
</svg>
