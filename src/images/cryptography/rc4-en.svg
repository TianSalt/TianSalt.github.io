<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RC4 expands a seed into a 2048-bit state and loops, emitting one byte per round</title>
  <desc id="d">A 128-bit seed k is expanded into 2048 bits of internal state. A loop then runs for as long as needed, outputting one byte of pad per round.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="298.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="48" font-size="23" font-weight="700" fill="#0f172a">RC4: stretch the seed, then loop</text>

  <rect x="48" y="104" width="150" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="123" y="131" font-size="21" font-weight="700" fill="#1e3a8a" text-anchor="middle">k</text>
  <text x="123" y="152" font-size="15.5" fill="#1e40af" text-anchor="middle">seed, e.g. 128 bits</text>
  <line x1="198" y1="136" x2="240" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="280" y="72" font-size="15.5" fill="#475569" text-anchor="middle">internal state, 2048 bits</text>
  <rect x="250" y="84" width="60" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="310" y1="136" x2="426" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 470 96 A 56 34 0 1 1 578 96" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="104" width="188" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="524" y="131" font-size="21" font-weight="700" fill="#1e3a8a" text-anchor="middle">one round</text>
  <text x="524" y="152" font-size="15.5" fill="#64748b" text-anchor="middle">output: 1 byte</text>
  <text x="524" y="196" font-size="15.5" fill="#475569" text-anchor="middle">loops for as long as the message needs</text>
  <line x1="618" y1="136" x2="660" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="664" y="112" width="248" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="788" y="142" font-size="19" fill="#1e3a8a" text-anchor="middle">pad z₁ z₂ z₃ ⋯</text>

  <text x="48" y="256" font-size="18.5" fill="#dc2626">the first bytes of the pad are biased, so the stream is usually started at byte 257</text>
</svg>
