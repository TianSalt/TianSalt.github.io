  <title id="t">The Vigenere cipher as six Caesar ciphers</title>
  <desc id="d">The plaintext ATTACKATDAWN is encrypted with the repeating key CRYPTOCRYPTOC. Colours mark the six interleaved subsequences, each encrypted by a single Caesar shift.</desc>
