<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', sans-serif">
  <title id="t">A random variable partitions the sample space</title>
  <desc id="d">The random variable X maps four strings to two values. Each value collects a fiber of inputs; its probability is the total weight of that fiber.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="378.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="55" y="65" width="390" height="270" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="96" font-size="20" fill="#0f172a" text-anchor="start" font-weight="700">U = {0,1}²</text>
  <circle cx="170" cy="155" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="162" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">00</text>
  <circle cx="170" cy="245" r="32" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="170" y="252" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">01</text>
  <circle cx="330" cy="155" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="162" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">10</text>
  <circle cx="330" cy="245" r="32" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="330" y="252" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">11</text>
  <rect x="620" y="65" width="280" height="270" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="645" y="96" font-size="20" fill="#0f172a" text-anchor="start" font-weight="700">V = {0,1}</text>
  <circle cx="760" cy="155" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="163" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="700">0</text>
  <circle cx="760" cy="245" r="34" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="760" y="253" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
  <line x1="204" y1="155" x2="724" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.85"/>
  <line x1="364" y1="155" x2="724" y2="155" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.85"/>
  <line x1="204" y1="245" x2="724" y2="245" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" opacity="0.85"/>
  <line x1="364" y1="245" x2="724" y2="245" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)" opacity="0.85"/>
  <text x="470" y="135" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="600">fiber of 0</text>
  <text x="470" y="275" font-size="15" fill="#d97706" text-anchor="middle" font-weight="600">fiber of 1</text>
  <text x="480" y="360" font-size="17" fill="#475569" text-anchor="middle" font-weight="500">Pr[X = v] = Σ P(x)  over all x with X(x) = v</text>
</svg>
