<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d" font-family="'IBM Plex Sans', sans-serif">
  <title id="t">The union bound</title>
  <desc id="d">Two overlapping events inside the universe. The union covers the overlap once, while the sum of probabilities counts it twice.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="960" height="350" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="348.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="80" y="45" width="800" height="240" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="102" y="74" font-size="18" fill="#94a3b8" text-anchor="start" font-weight="600">U</text>
  <ellipse cx="390" cy="165" rx="175" ry="95" fill="#2563eb" opacity="0.26" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="570" cy="165" rx="175" ry="95" fill="#d97706" opacity="0.26" stroke="#d97706" stroke-width="2"/>
  <text x="290" y="173" font-size="26" fill="#1d4ed8" text-anchor="middle" font-weight="700">A₁</text>
  <text x="670" y="173" font-size="26" fill="#d97706" text-anchor="middle" font-weight="700">A₂</text>
  <text x="480" y="171" font-size="17" fill="#7c2d12" text-anchor="middle" font-weight="600">A₁ ∩ A₂</text>
  <line x1="480" y1="292" x2="480" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="480" y="320" font-size="15" fill="#475569" text-anchor="middle" font-weight="400">the overlap is counted twice when the two probabilities are added</text>
</svg>
