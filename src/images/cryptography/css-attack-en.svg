<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The cryptanalysis of CSS</title>
  <desc id="d">A known plaintext prefix XORed with the ciphertext prefix gives the first twenty bytes of the CSS pad. The attacker tries all 2^17 initial states of the 17-bit register, subtracts each candidate output from the pad prefix, and tests the remainder against the public recurrence of the 25-bit register. Only the correct guess passes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="458.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="48" font-size="23" font-weight="700" fill="#0f172a">The 2¹⁷ guess: attack the two registers separately</text>

  <rect x="48" y="86" width="180" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="138" y="113" font-size="17.5" fill="#0f172a" text-anchor="middle">ciphertext prefix</text>
  <rect x="48" y="146" width="180" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="173" font-size="17.5" fill="#1e3a8a" text-anchor="middle">known MPEG prefix</text>

  <line x1="228" y1="108" x2="248" y2="108" stroke="#475569" stroke-width="1.5"/>
  <line x1="248" y1="108" x2="248" y2="132" stroke="#475569" stroke-width="1.5"/>
  <line x1="228" y1="168" x2="248" y2="168" stroke="#475569" stroke-width="1.5"/>
  <line x1="248" y1="168" x2="248" y2="144" stroke="#475569" stroke-width="1.5"/>
  <circle cx="268" cy="138" r="19" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="268" y="145" font-size="26" fill="#334155" text-anchor="middle">&#x2295;</text>
  <line x1="287" y1="138" x2="322" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="326" y="114" width="250" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="451" y="143" font-size="18.5" fill="#1e3a8a" text-anchor="middle">CSS pad, first 20 bytes</text>

  <rect x="48" y="228" width="520" height="152" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="264" font-size="19" font-weight="700" fill="#0f172a">for each of the 2¹⁷ settings of the 17-bit LFSR</text>
  <text x="72" y="296" font-size="17" fill="#0f172a">&#x2022; run it for 20 bytes, subtract from the pad prefix</text>
  <text x="72" y="324" font-size="17" fill="#0f172a">&#x2022; the remainder is a candidate 25-bit LFSR output</text>
  <text x="72" y="352" font-size="17" fill="#0f172a">&#x2022; test it against the public 25-bit recurrence</text>

  <line x1="568" y1="304" x2="596" y2="304" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="248" width="312" height="112" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="756" y="282" font-size="18.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">only the right guess survives</text>
  <text x="756" y="308" font-size="16.5" fill="#1e40af" text-anchor="middle">a wrong candidate passes 135 linear</text>
  <text x="756" y="330" font-size="16.5" fill="#1e40af" text-anchor="middle">checks with probability 2⁻¹³⁵</text>

  <text x="48" y="424" font-size="18" fill="#dc2626">both initial states are then known: regenerate the whole pad and decrypt the movie</text>
</svg>
