<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Stream cipher disk encryption leaks where a file changed</title>
  <desc id="d">A file addressed To: Bob is saved to an encrypted disk, then edited to To: Eve and saved again under the same key. Comparing the two disk snapshots, only the segment holding the address differs; every other ciphertext block is identical.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="328.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="38" font-size="23" font-weight="700" fill="#0f172a">Two snapshots of the same disk, one key</text>

  <rect x="48" y="62" width="130" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="84" font-size="20" fill="#0f172a">To: Bob</text>
  <line x1="60" y1="102" x2="166" y2="102" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="116" x2="166" y2="116" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="130" x2="140" y2="130" stroke="#cbd5e1" stroke-width="2"/>
  <text x="113" y="54" font-size="17" fill="#64748b" text-anchor="middle">file, before</text>

  <line x1="186" y1="102" x2="236" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="211" y="92" font-size="17" fill="#475569" text-anchor="middle">enc.</text>

  <rect x="240" y="78" width="672" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="360" y1="78" x2="360" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="78" x2="480" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="78" x2="600" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="720" y1="78" x2="720" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <line x1="840" y1="78" x2="840" y2="126" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="107" font-size="19" fill="#0f172a" text-anchor="middle">To: Bob</text>

  <rect x="48" y="196" width="130" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="218" font-size="20" fill="#dc2626">To: Eve</text>
  <line x1="60" y1="236" x2="166" y2="236" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="250" x2="166" y2="250" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="264" x2="140" y2="264" stroke="#cbd5e1" stroke-width="2"/>
  <text x="113" y="188" font-size="17" fill="#64748b" text-anchor="middle">file, after</text>

  <line x1="186" y1="236" x2="236" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="211" y="226" font-size="17" fill="#475569" text-anchor="middle">enc.</text>

  <rect x="240" y="212" width="672" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="360" y1="212" x2="360" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="212" x2="480" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="212" x2="600" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="720" y1="212" x2="720" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="840" y1="212" x2="840" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="241" font-size="19" fill="#dc2626" text-anchor="middle">To: Eve</text>

  <rect x="240" y="78" width="120" height="48" rx="8" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="240" y="212" width="120" height="48" rx="8" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="300" y1="126" x2="300" y2="212" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="316" y="174" font-size="18.5" fill="#dc2626">the only segment that differs</text>
</svg>
