<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI', 'Segoe UI Symbol', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The CSS stream cipher</title>
  <desc id="d">The 40-bit key is split: a leading 1 concatenated with the first two bytes seeds a 17-bit LFSR, and a leading 1 with the last three bytes seeds a 25-bit LFSR. Each register emits eight bits per round; the two bytes and the carry from the previous round are added modulo 256 to give one pad byte.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="398.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="48" font-size="23" font-weight="700" fill="#0f172a">CSS: two LFSRs, added modulo 256</text>

  <rect x="48" y="150" width="150" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="123" y="177" font-size="21" font-weight="700" fill="#1e3a8a" text-anchor="middle">k</text>
  <text x="123" y="198" font-size="15.5" fill="#1e40af" text-anchor="middle">5 bytes = 40 bits</text>

  <line x1="198" y1="182" x2="258" y2="182" stroke="#475569" stroke-width="1.5"/>
  <line x1="258" y1="182" x2="258" y2="124" stroke="#475569" stroke-width="1.5"/>
  <line x1="258" y1="124" x2="326" y2="124" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="258" y1="182" x2="258" y2="248" stroke="#475569" stroke-width="1.5"/>
  <line x1="258" y1="248" x2="326" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="84" font-size="15.5" fill="#475569" text-anchor="middle">1 &#x2016; first 2 bytes</text>
  <text x="415" y="208" font-size="15.5" fill="#475569" text-anchor="middle">1 &#x2016; last 3 bytes</text>

  <rect x="330" y="98" width="170" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="130" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">17-bit LFSR</text>
  <rect x="330" y="222" width="170" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="254" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">25-bit LFSR</text>

  <line x1="500" y1="124" x2="560" y2="124" stroke="#475569" stroke-width="1.5"/>
  <line x1="560" y1="124" x2="560" y2="164" stroke="#475569" stroke-width="1.5"/>
  <line x1="560" y1="164" x2="574" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="112" font-size="15.5" fill="#475569" text-anchor="middle">8 bits</text>
  <line x1="500" y1="248" x2="560" y2="248" stroke="#475569" stroke-width="1.5"/>
  <line x1="560" y1="248" x2="560" y2="206" stroke="#475569" stroke-width="1.5"/>
  <line x1="560" y1="206" x2="574" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="272" font-size="15.5" fill="#475569" text-anchor="middle">8 bits</text>

  <rect x="578" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="653" y="193" font-size="21" font-weight="700" fill="#1e3a8a" text-anchor="middle">+ (mod 256)</text>
  <line x1="653" y1="300" x2="653" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="653" y="322" font-size="15.5" fill="#475569" text-anchor="middle">carry from the previous byte</text>

  <line x1="728" y1="185" x2="770" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="774" y="161" width="138" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="843" y="190" font-size="18.5" fill="#1e3a8a" text-anchor="middle">one pad byte</text>

  <text x="48" y="372" font-size="18" fill="#dc2626">40-bit keys were all that U.S. export rules allowed when CSS was designed</text>
</svg>
