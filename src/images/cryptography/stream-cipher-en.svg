<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 214" width="960" height="214" role="img" aria-labelledby="t d">
  <title id="t">A stream cipher stretches a short key into a pad as long as the message</title>
  <desc id="d">A short key k of s bits enters the public deterministic generator G, whose output is an n-bit pseudorandom pad. The pad is XORed with the n-bit message to produce the ciphertext. The key is drawn short and the pad long, showing how a small secret covers a long message.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="214" rx="18" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="958.5" height="212.5" rx="17.25" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="48" y="38" font-size="15" font-weight="700" fill="#0f172a">One short key, one long pad</text>

  <rect x="48" y="72" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="92" y="95" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">k</text>
  <text x="92" y="111" font-size="11" fill="#1e40af" text-anchor="middle">s bits</text>

  <line x1="136" y1="96" x2="178" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="182" y="64" width="112" height="64" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="238" y="94" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">G</text>
  <text x="238" y="112" font-size="11" fill="#64748b" text-anchor="middle">PRG</text>

  <line x1="294" y1="96" x2="340" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="344" y="70" font-size="12" fill="#475569">pseudorandom pad G(k), n bits</text>
  <rect x="344" y="79" width="420" height="34" rx="6" fill="#2563eb" fill-opacity="0.9"/>
  <text x="554" y="101" font-size="13" fill="#ffffff" text-anchor="middle">G(k)</text>

  <text x="344" y="140" font-size="12" fill="#475569">message m, n bits</text>
  <rect x="344" y="146" width="420" height="34" rx="6" fill="#64748b" fill-opacity="0.9"/>
  <text x="554" y="168" font-size="13" fill="#ffffff" text-anchor="middle">m</text>

  <line x1="764" y1="96" x2="812" y2="96" stroke="#475569" stroke-width="1.5"/>
  <line x1="812" y1="96" x2="812" y2="112" stroke="#475569" stroke-width="1.5"/>
  <line x1="764" y1="163" x2="812" y2="163" stroke="#475569" stroke-width="1.5"/>
  <line x1="812" y1="163" x2="812" y2="150" stroke="#475569" stroke-width="1.5"/>

  <circle cx="812" cy="131" r="18" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="812" y="137" font-size="17" fill="#334155" text-anchor="middle">⊕</text>

  <line x1="830" y1="131" x2="860" y2="131" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="864" y="109" width="80" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="904" y="137" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">c</text>
</svg>
